services:
  api:
    image: ${APP_IMAGE}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT:-5000}
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:${APP_PORT:-5000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${APP_PORT:-5000}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
